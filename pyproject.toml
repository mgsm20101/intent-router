[project]
name = "intent-router"
version = "0.1.0"
description = "Dual-approach intent classifier (fine-tuned encoder vs. self-hosted LLM) with an eval harness."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]
